repos:
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8

# The four non-ML CGE analyses are vendored model code that does not follow the
# project's formatting conventions. The ML-enabled CGE analyses are NOT excluded.
# Keep this list in step with `exclude` in .flake8, which the CI lint job uses.
exclude: '^(build/|(pyincore|tests/pyincore)/analyses/(joplincge|joplincgeanalysis|saltlakecge|seasidecge|galvestoncge)/)'
