name: pytests

# Runs unit tests on:
#  - any push to any branch
#  - when a PR is opened/reopened - this is just for additional safety and covers the case of main -> develop PRs without new pushes

on:
  push:
  pull_request:
     types: [opened, reopened]

jobs:
  unit_test:
    runs-on: ubuntu-latest
    strategy:
      # Run one Python version at a time: all jobs share the same test account and data on dev
      max-parallel: 1
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    name: Python ${{ matrix.python-version }} Test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache conda
        uses: actions/cache@v4
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
            hashFiles('environment.yml') }}

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          create-args: >-
            python=${{ matrix.python-version }}
            pytest
          environment-file: environment.yml
          generate-run-shell: true

      - name: Run tests with pytest
        run: |
          echo "${{secrets.PYTEST_USER_TOKEN}}" > tests/pyincore/.incorepw
          python -m pytest --ignore=tests/test_format.py --ignore=tests/pyincore/analyses
        shell: micromamba-shell {0}
